# R CMD check --use-valgrind (the examples run under memcheck; the tests are
# left to the next step), then the quick test subset under memcheck with
# leak checking; any memcheck error fails the job. valgrind
# does not emulate AVX-512, so the avx512 tier is not detected here. The
# kernel tests run on avx2 and none only: R runs a few hundred times slower
# under memcheck, and sse2 shares avx2's tail handling.
on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

name: valgrind

permissions: read-all

jobs:
  valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
      _R_CHECK_TESTS_NLINES_: 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::callr, any::bit64
          needs: check

      - name: R CMD check --use-valgrind
        run: |
          R CMD build --no-build-vignettes --no-manual .
          R CMD check --use-valgrind --no-tests --no-manual --ignore-vignettes rsimd_*.tar.gz
          # Under --use-valgrind, memcheck's output goes to the .Rout file.
          ! grep -E 'ERROR SUMMARY: [1-9]' rsimd.Rcheck/rsimd-Ex.Rout

      - name: Quick test subset under memcheck
        if: always()
        env:
          RSIMD_TEST_SUBSET: quick
          RSIMD_TEST_TIERS: avx2
        run: |
          R CMD INSTALL rsimd_*.tar.gz
          sh tools/ci/run_tests.sh --label "valgrind (quick, avx2)" --log valgrind.log \
            --impl avx2 --expect-impl avx2 \
            --runner "valgrind --tool=memcheck --leak-check=full --track-origins=yes --error-exitcode=1 --suppressions=$GITHUB_WORKSPACE/tools/ci/valgrind.supp"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: valgrind
          path: |
            rsimd.Rcheck/rsimd-Ex.Rout
            valgrind.log
