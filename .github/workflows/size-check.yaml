# CRAN size budget: the source tarball and the installed package (with the
# library stripped of debugging information) must stay under 5 MB, no
# installed directory but libs may exceed 1 MB, and the vendored code and
# the shared library must stay within their own budgets. The tarball must
# hold only files tracked in git or generated by R CMD build.
on:
  push:
    branches: [main]
    paths-ignore:
      - "issues/**"
      - "bench/**"
      - ".devcontainer/**"
      - "CONTRIBUTING.md"
      - "cran-comments.md"
      - "LICENSE.md"
  pull_request:
    paths-ignore:
      - "issues/**"
      - "bench/**"
      - ".devcontainer/**"
      - "CONTRIBUTING.md"
      - "cran-comments.md"
      - "LICENSE.md"

name: size-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Build and install
        run: |
          R CMD build --no-build-vignettes --no-manual .
          mkdir lib
          R CMD INSTALL -l lib rsimd_*.tar.gz

      - name: Check sizes
        run: |
          RSIMD_PKG_DIR=lib/rsimd RSIMD_SO=lib/rsimd/libs/rsimd.so \
            sh tools/check_size.sh rsimd_*.tar.gz | tee size.txt
          { echo '```'; cat size.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Check tarball contents
        run: sh tools/check_tarball.sh rsimd_*.tar.gz
