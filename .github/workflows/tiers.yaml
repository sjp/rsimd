# Runs the whole test suite once per available implementation tier, each
# run starting R with RSIMD_IMPL set to that tier, and fails if a tier every
# machine of the architecture must have (sse2 and avx2 on x86-64, neon on
# arm64, none everywhere) was not built or not detected.
on:
  push:
    branches: [main]
  pull_request:

name: tiers

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tiers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::callr, any::bit64
          needs: check

      - name: Install
        run: R CMD INSTALL . 2>&1 | tee install.log

      - name: Run the tests once per tier
        run: sh tools/ci/test_tiers.sh --out tiers.txt --logs logs

      - name: Record the compiler and flags
        if: always()
        run: |
          for v in CC CFLAGS; do echo "$v = $(R CMD config $v)"; done | tee r-config.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tiers-${{ matrix.os }}
          path: |
            tiers.txt
            r-config.txt
            install.log
            logs
