# R CMD check --as-cran on every platform the package must pass on, each
# job also running the dispatch tests once per tier (check-os.yaml), plus
# builds that must keep working (no SLEEF; a compiler without AVX-512).
#
# On pull requests: ubuntu release (with the vignettes and the PDF manual),
# devel and oldrel-1, ubuntu arm64, macOS arm64 and Windows, the others
# without vignettes or LaTeX. On pushes to main also macOS x86-64, the
# vignettes on every platform, and the build variants. The fast workflow
# gives the first signal; coverage runs on pushes to main.
on:
  push:
    branches: [main]
    paths-ignore:
      - "issues/**"
      - "bench/**"
      - ".devcontainer/**"
      - "CONTRIBUTING.md"
      - "cran-comments.md"
      - "LICENSE.md"
  pull_request:
    paths-ignore:
      - "issues/**"
      - "bench/**"
      - ".devcontainer/**"
      - "CONTRIBUTING.md"
      - "cran-comments.md"
      - "LICENSE.md"

name: R-CMD-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: release, linux-checks: true, manual: true }
          - { os: ubuntu-latest, r: devel, http-user-agent: release }
          - { os: ubuntu-latest, r: oldrel-1 }
          - { os: ubuntu-24.04-arm, r: release, linux-checks: true }
          - { os: macos-latest, r: release }
          - { os: windows-latest, r: release }
    uses: ./.github/workflows/check-os.yaml
    secrets: inherit
    with:
      os: ${{ matrix.config.os }}
      r: ${{ matrix.config.r }}
      http-user-agent: ${{ matrix.config.http-user-agent || '' }}
      linux-checks: ${{ matrix.config.linux-checks || false }}
      manual: ${{ matrix.config.manual || false }}
      # Every job builds the vignettes on main; on pull requests only the
      # one that builds the manual.
      vignettes: ${{ matrix.config.manual || github.event_name != 'pull_request' }}

  check-main:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/check-os.yaml
    secrets: inherit
    with:
      os: macos-15-intel
      r: release
      vignettes: true

  build-variants:
    # Builds that must still work: without SLEEF, and with a compiler that
    # cannot build the avx512 tier or SLEEF's AVX-512 header.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [no-sleef, no-avx512]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MAKEFLAGS: -j4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::testthat, any::callr, any::bit64
          cache-version: 1

      - name: Configure the variant
        run: |
          if [ "${{ matrix.variant }}" = no-sleef ]; then
            echo "RSIMD_DISABLE_SLEEF=1" >> "$GITHUB_ENV"
          else
            # A compiler wrapper that rejects AVX-512 flags.
            mkdir -p "$HOME/.R"
            # shellcheck disable=SC2016
            printf '#!/bin/sh\nfor a in "$@"; do case "$a" in -mavx512*) echo "no AVX-512" >&2; exit 1 ;; esac; done\nexec gcc "$@"\n' > "$HOME/cc-no-avx512"
            chmod +x "$HOME/cc-no-avx512"
            echo "CC=$HOME/cc-no-avx512" > "$HOME/.R/Makevars"
          fi

      - name: Install
        run: R CMD INSTALL . 2>&1 | tee install.log

      - name: Check the build
        run: |
          sh tools/check_build.sh install.log
          if [ "${{ matrix.variant }}" = no-avx512 ]; then
            grep -q 'can build the avx512 tier.*no (dropped)' install.log
          else
            grep -q 'tiers with SLEEF elementary functions: (no tier)' install.log
          fi

      - name: Test
        run: sh tools/ci/run_tests.sh --label "${{ matrix.variant }}"
